<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Haug og Datter</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Inter:wght@400;450;500;600&family=JetBrains+Mono:wght@400;500&display=swap" />
<style>
  *,*::before,*::after { box-sizing: border-box; }
  html, body, h1, h2, h3, h4, p, ul, ol, figure, blockquote, dl, dt, dd { margin: 0; padding: 0; }
  ul, ol { list-style: none; }
  img, svg { display: block; max-width: 100%; height: auto; }

  :root {
    --paper: #DDD8CC;
    --paper-warm: #E3DED3;
    --card: #E9E4D9;
    --ink: #14181A;
    --ink-soft: #4A5054;
    --ink-mute: #7B8186;
    --ink-faint: #A9AEB1;
    --line: rgba(20, 24, 26, 0.12);
    --line-strong: rgba(20, 24, 26, 0.22);

    --forest: #2C4A3A;
    --forest-deep: #1F3528;
    --rust: #A85436;
    --rust-deep: #7A3A22;
    --wood-deep: #8B6F47;

    --accent: var(--forest);
    --accent-deep: var(--forest-deep);

    --ease: cubic-bezier(.2,.7,.25,1);
    --ease-out: cubic-bezier(.16,1,.3,1);
  }

  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 16px;
    line-height: 1.65;
    color: var(--ink);
    background: var(--paper);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
    font-feature-settings: 'kern','liga','calt','ss01';
    overflow-x: hidden;
  }

  /* Fin støvkornet tekstur — meget subtil */
  body::before {
    content: "";
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 1;
    opacity: 0.32;
    mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='1.1' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.08  0 0 0 0 0.09  0 0 0 0 0.10  0 0 0 0.05 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    background-size: 220px 220px;
  }
  /* Tynn rutemønster — ekstremt subtilt teknisk anker */
  body::after {
    content: "";
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 0;
    opacity: 0.5;
    background-image:
      linear-gradient(to right, rgba(20,24,26,0.04) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(20,24,26,0.04) 1px, transparent 1px);
    background-size: 96px 96px;
    mask-image: radial-gradient(ellipse 80% 60% at 50% 30%, #000 30%, transparent 75%);
  }
  body > * { position: relative; z-index: 2; }

  /* Mus-følgende lysflekk på hub-en — meget subtil */
  .spotlight {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 0;
    opacity: 0;
    transition: opacity 600ms ease;
    background:
      radial-gradient(520px circle at var(--mx, 50%) var(--my, 30%), rgba(232, 234, 226, 0.55), transparent 60%),
      radial-gradient(180px circle at var(--mx, 50%) var(--my, 30%), rgba(255, 255, 250, 0.18), transparent 70%);
  }
  .spotlight.is-on { opacity: 1; }

  .theme-root { min-height: 100vh; position: relative; }
  .theme-root[data-app] {
    background: color-mix(in oklab, var(--paper) 90%, var(--accent) 10%);
    transition: background 380ms var(--ease);
  }
  body:has(.theme-root[data-app="bumle-bjorn"])     { background: color-mix(in oklab, #DDD8CC 90%, #A85436 10%); }
  body:has(.theme-root[data-app="plantekn"])        { background: color-mix(in oklab, #DDD8CC 90%, #2C4A3A 10%); }
  body:has(.theme-root[data-app="tenkt"])           { background: color-mix(in oklab, #DDD8CC 90%, #8B6F47 10%); }
  body:has(.theme-root[data-app="kvitteringsvakt"]) { background: color-mix(in oklab, #DDD8CC 90%, #7A3A22 10%); }
  body:has(.theme-root[data-app="inklings-journal"]){ background: color-mix(in oklab, #DDD8CC 90%, #1F3528 10%); }

  /* App-backdrop — unik tekstur per app */
  .app-backdrop {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
    mask-image: linear-gradient(to bottom, #000 0%, #000 70%, transparent 100%);
    -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 70%, transparent 100%);
  }
  .theme-root > .stage { position: relative; z-index: 1; }
  .theme-root[data-app="bumle-bjorn"] .app-backdrop {
    background:
      radial-gradient(circle at 88% 22%, var(--accent) 0, var(--accent) 220px, transparent 320px);
    opacity: 0.07;
  }
  .theme-root[data-app="plantekn"] .app-backdrop {
    background-image:
      linear-gradient(to right, var(--accent) 1px, transparent 1px),
      linear-gradient(to bottom, var(--accent) 1px, transparent 1px);
    background-size: 80px 80px;
    background-position: 24px 24px;
    opacity: 0.10;
  }
  .theme-root[data-app="tenkt"] .app-backdrop {
    background-image: radial-gradient(circle, var(--accent) 1.4px, transparent 1.6px);
    background-size: 28px 28px;
    opacity: 0.13;
  }
  .theme-root[data-app="kvitteringsvakt"] .app-backdrop {
    background-image: repeating-linear-gradient(to bottom, var(--accent) 0, var(--accent) 1px, transparent 1px, transparent 22px);
    opacity: 0.10;
  }
  .theme-root[data-app="inklings-journal"] .app-backdrop {
    background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 31px, var(--accent) 31px, var(--accent) 32px);
    opacity: 0.09;
  }

  /* Hero-glyph — stor SVG-mark bak app-tittel */
  .app-hero { position: relative; }
  .app-hero__l, .app-hero__r { position: relative; z-index: 2; }
  .app-hero__glyph {
    position: absolute;
    top: -32px; right: -8px;
    width: clamp(200px, 26vw, 340px);
    height: clamp(200px, 26vw, 340px);
    color: var(--accent);
    opacity: 0.16;
    pointer-events: none;
    z-index: 1;
    animation: glyphFloat 18s ease-in-out infinite;
    transform-origin: center;
  }
  .app-hero__glyph svg { width: 100%; height: 100%; display: block; }
  @keyframes glyphFloat {
    0%, 100% { transform: rotate(-1deg) translateY(0); }
    50%      { transform: rotate(1.5deg) translateY(-8px); }
  }
  @media (max-width: 720px) {
    .app-hero__glyph { top: auto; bottom: -40px; right: -20px; width: 180px; height: 180px; opacity: 0.10; }
  }

  /* Route-svep i appens accent-farge */
  .sweep {
    position: fixed; inset: 0;
    z-index: 950;
    pointer-events: none;
    background: var(--accent, #2C4A3A);
    clip-path: inset(0 100% 0 0);
    will-change: clip-path;
  }
  .sweep.in {
    transition: clip-path 340ms cubic-bezier(.7,0,.3,1);
    clip-path: inset(0 0 0 0);
  }
  .sweep.out {
    transition: clip-path 420ms cubic-bezier(.7,0,.3,1);
    clip-path: inset(0 0 0 100%);
  }

  /* Kommandopalett (⌘K) */
  .palette {
    position: fixed; inset: 0;
    z-index: 1100;
    display: none;
    align-items: flex-start;
    justify-content: center;
    padding-top: 16vh;
  }
  .palette.is-open { display: flex; }
  .palette__bd {
    position: absolute; inset: 0;
    background: rgba(20, 24, 26, 0.42);
    backdrop-filter: blur(14px) saturate(120%);
    -webkit-backdrop-filter: blur(14px) saturate(120%);
    animation: paletteFade 220ms var(--ease-out);
  }
  @keyframes paletteFade { from { opacity: 0; } to { opacity: 1; } }
  .palette__panel {
    position: relative;
    width: min(580px, calc(100vw - 32px));
    background: var(--paper-warm);
    border: 1px solid var(--line-strong);
    border-radius: 10px;
    box-shadow: 0 32px 80px -20px rgba(20,24,26,0.4), 0 0 0 1px rgba(255,255,255,0.4) inset;
    overflow: hidden;
    animation: palettePop 280ms var(--ease-out);
  }
  @keyframes palettePop {
    from { transform: translateY(8px) scale(.985); opacity: 0; }
    to   { transform: none; opacity: 1; }
  }
  .palette__head {
    display: flex; align-items: center;
    border-bottom: 1px solid var(--line);
  }
  .palette__sigil {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--ink-mute);
    padding: 0 18px;
    border-right: 1px solid var(--line);
    align-self: stretch; display: flex; align-items: center;
  }
  .palette__input {
    flex: 1;
    padding: 18px 20px;
    border: 0;
    background: transparent;
    font-family: 'Inter', sans-serif;
    font-size: 16px;
    color: var(--ink);
    outline: none;
    letter-spacing: -0.005em;
  }
  .palette__input::placeholder { color: var(--ink-mute); }
  .palette__list { padding: 6px; max-height: 50vh; overflow-y: auto; }
  .palette__list:empty::before {
    content: 'Ingen treff';
    display: block;
    padding: 18px 14px;
    color: var(--ink-mute);
    font-size: 13px;
  }
  .palette__item {
    display: flex; align-items: center; gap: 14px;
    padding: 11px 14px;
    border-radius: 6px;
    cursor: pointer;
    color: var(--ink);
    transition: background 120ms var(--ease);
  }
  .palette__item.is-active { background: var(--ink); color: var(--paper-warm); }
  .palette__item.is-active .palette__sub,
  .palette__item.is-active .palette__hex { color: var(--paper-warm); opacity: 0.65; }
  .palette__sw {
    width: 12px; height: 12px; border-radius: 2px;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.18);
    flex-shrink: 0;
  }
  .palette__nm {
    font-family: 'Newsreader', Georgia, serif;
    font-size: 17px; font-weight: 500;
    letter-spacing: -0.012em;
    flex: 1; min-width: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .palette__sub {
    font-size: 12px; color: var(--ink-mute);
    flex: 0 0 auto; max-width: 32%;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .palette__hex {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 10.5px; color: var(--ink-mute);
    letter-spacing: 0.06em; flex: 0 0 auto;
  }
  .palette__foot {
    display: flex; gap: 18px; align-items: center;
    padding: 10px 16px;
    border-top: 1px solid var(--line);
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--ink-mute);
  }
  .palette__foot kbd {
    font-family: inherit; font-size: 9.5px;
    padding: 2px 6px; border-radius: 3px;
    background: var(--ink); color: var(--paper-warm);
    margin-right: 6px;
  }

  /* ---------- Preview-bar ----------

  /* Lese-progresjon */
  .progress {
    position: fixed; top: 0; left: 0;
    height: 1px; width: 0%;
    background: var(--accent);
    z-index: 100;
    transition: width 80ms linear, background 320ms ease;
  }

  /* ---------- Type ---------- */
  h1, h2, h3 {
    font-family: 'Newsreader', Georgia, serif;
    font-weight: 400;
    color: var(--ink);
    letter-spacing: -0.022em;
  }
  p { color: var(--ink-soft); }
  .lede {
    font-family: 'Newsreader', Georgia, serif;
    font-weight: 400;
    font-size: 22px;
    line-height: 1.45;
    color: var(--ink);
    letter-spacing: -0.008em;
  }
  .mono {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-feature-settings: 'tnum';
    font-variant-numeric: tabular-nums;
  }
  .micro {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-mute);
    font-weight: 400;
  }

  a {
    color: var(--ink);
    text-decoration: none;
    transition: color 220ms var(--ease);
  }
  a:focus-visible { outline: 1px solid var(--accent); outline-offset: 6px; border-radius: 2px; }

  /* Tekst-lenker: animert understreking */
  .tx-link {
    background-image: linear-gradient(currentColor, currentColor);
    background-position: 0 100%;
    background-repeat: no-repeat;
    background-size: 100% 1px;
    padding-bottom: 2px;
    color: var(--accent);
    transition: color 220ms var(--ease), background-size 360ms var(--ease);
  }
  .tx-link:hover {
    background-image: linear-gradient(var(--ink), var(--ink));
    color: var(--ink);
  }

  /* ---------- Layout ---------- */
  .stage {
    max-width: 1080px;
    margin: 0 auto;
    padding: 32px 24px 32px;
    position: relative;
  }
  @media (min-width: 720px) { .stage { padding: 40px 56px 56px; } }
  @media (min-width: 1000px) { .stage { padding: 48px 80px 64px; } }

  /* ---------- Topbar ---------- */
  .topbar {
    display: flex; justify-content: space-between; align-items: center;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 96px;
  }
  .topbar .mark {
    display: flex; align-items: baseline; gap: 14px;
    text-decoration: none; color: var(--ink);
  }
  .topbar .mark .nm {
    font-family: 'Newsreader', Georgia, serif;
    font-weight: 500;
    font-style: italic;
    font-size: 18px;
    letter-spacing: -0.012em;
    color: var(--ink);
  }
  .topbar .mark .meta {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 10.5px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-mute);
  }
  .topbar .nav {
    display: flex; gap: 28px; align-items: baseline;
  }
  .topbar .nav a {
    font-size: 13.5px;
    color: var(--ink-soft);
    transition: color 220ms var(--ease);
  }
  .topbar .nav a:hover { color: var(--accent); }
  .topbar .meter {
    display: inline-flex; align-items: center; gap: 14px;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 10.5px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-mute);
  }
  .topbar .meter .seg {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 0;
  }
  .topbar .meter .seg + .seg {
    padding-left: 14px;
    border-left: 1px solid var(--line);
  }
  .topbar .meter .dot {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 0 var(--accent);
    animation: pulse 2.4s var(--ease) infinite;
  }
  .topbar .meter .clock { color: var(--ink); font-weight: 500; letter-spacing: 0.06em; min-width: 8.5ch; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(44,74,58,0.45); }
    70% { box-shadow: 0 0 0 7px rgba(44,74,58,0); }
    100% { box-shadow: 0 0 0 0 rgba(44,74,58,0); }
  }

  /* ---------- Hero ---------- */
  .hero {
    padding: 8px 0 72px;
    max-width: 880px;
  }
  .hero .display {
    font-family: 'Newsreader', Georgia, serif;
    font-weight: 400;
    font-size: clamp(64px, 11vw, 156px);
    line-height: 0.94;
    letter-spacing: -0.04em;
    color: var(--ink);
    text-shadow: 0 1px 0 rgba(255, 255, 250, 0.35);
    perspective: 1000px;
    transform-style: preserve-3d;
  }
  .hero .display .ltr {
    display: inline-block;
    transition: transform 480ms var(--ease-out);
    will-change: transform;
  }
  .hero .display .amp {
    font-style: italic;
    color: var(--accent);
    font-weight: 500;
    padding: 0 0.05em;
    display: inline-block;
    transition: transform 480ms var(--ease-out);
    will-change: transform;
  }
  .hero .lede {
    margin-top: 36px;
    max-width: 32ch;
    font-size: clamp(20px, 2.2vw, 26px);
    line-height: 1.4;
    color: var(--ink-soft);
  }

  /* ---------- Verket ---------- */
  .verket {
    margin: 24px 0 96px;
  }
  .verket__head {
    display: flex; justify-content: space-between; align-items: baseline;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 4px;
  }
  .verket__head .l { color: var(--ink-mute); }
  .verket__head .r { color: var(--ink-mute); }

  .verket__row {
    display: grid;
    grid-template-columns: 56px 1fr auto 28px;
    gap: 28px;
    align-items: center;
    padding: 28px 16px 28px 8px;
    border-bottom: 1px solid var(--line);
    color: var(--ink);
    position: relative;
    overflow: hidden;
    --row-accent: var(--forest);
  }
  .verket__row::before {
    content: "";
    position: absolute;
    inset: 0;
    background: var(--row-accent);
    transform: scaleX(0);
    transform-origin: left center;
    transition: transform 540ms var(--ease-out);
    z-index: 0;
  }
  .verket__row:hover::before { transform: scaleX(1); }
  .verket__row > * { position: relative; z-index: 1; transition: color 320ms var(--ease); }
  .verket__row:hover, .verket__row:hover .verket__num,
  .verket__row:hover .verket__name, .verket__row:hover .verket__tag,
  .verket__row:hover .verket__meta { color: var(--paper-warm); }
  .verket__row:hover .verket__arrow { color: var(--paper-warm); transform: translateX(6px); }

  .verket__num {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-feature-settings: 'tnum';
    font-size: 12px;
    color: var(--ink-mute);
    letter-spacing: 0.1em;
  }
  .verket__name {
    font-family: 'Newsreader', Georgia, serif;
    font-weight: 500;
    font-size: clamp(28px, 3.6vw, 38px);
    line-height: 1.05;
    letter-spacing: -0.025em;
    color: var(--ink);
  }
  .verket__tag {
    margin-top: 4px;
    font-size: 14.5px;
    color: var(--ink-mute);
    line-height: 1.4;
  }
  .verket__meta {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 11px;
    color: var(--ink-mute);
    letter-spacing: 0.04em;
    text-align: right;
    line-height: 1.4;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-feature-settings: 'tnum';
  }
  .verket__meta .swatch {
    display: inline-block;
    width: 10px; height: 10px;
    border-radius: 2px;
    background: var(--row-accent);
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.10), 0 0 0 1px rgba(255,255,255,0.4);
  }
  .verket__meta .hex { color: var(--ink-soft); }
  .verket__arrow {
    font-family: 'Newsreader', Georgia, serif;
    color: var(--ink-mute);
    font-size: 22px;
    transition: transform 360ms var(--ease), color 320ms var(--ease);
  }

  /* ---------- Editorial-tekst ---------- */
  .blocks {
    display: grid;
    grid-template-columns: 1fr;
    gap: 64px;
    margin: 96px 0 0;
    max-width: 720px;
  }
  .block h2 {
    font-size: 14px;
    font-weight: 400;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-mute);
    margin-bottom: 18px;
  }
  .block p {
    font-family: 'Newsreader', Georgia, serif;
    font-size: 22px;
    line-height: 1.45;
    color: var(--ink);
    max-width: 36ch;
    letter-spacing: -0.005em;
  }
  .block p + p { margin-top: 18px; }
  .block a.tx-link { color: var(--ink); }
  .block a.tx-link:hover { color: var(--accent); background-image: linear-gradient(var(--accent), var(--accent)); }

  /* ---------- Footer ---------- */
  .footer {
    margin-top: 96px;
    padding-top: 24px;
    border-top: 1px solid var(--line);
    display: flex; justify-content: space-between; align-items: baseline;
    gap: 16px;
    font-size: 12px;
    color: var(--ink-mute);
  }
  .footer .l, .footer .r {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  .footer a { color: var(--ink-mute); }
  .footer a:hover { color: var(--accent); }

  /* ---------- App-side hero ---------- */
  .app-hero {
    margin-bottom: 72px;
    display: grid;
    grid-template-columns: 1fr;
    gap: 48px;
    align-items: end;
  }
  @media (min-width: 720px) {
    .app-hero { grid-template-columns: 1.4fr 1fr; gap: 64px; }
  }
  .app-hero__l h1 {
    font-family: 'Newsreader', Georgia, serif;
    font-weight: 400;
    font-size: clamp(48px, 7.5vw, 96px);
    line-height: 0.98;
    letter-spacing: -0.032em;
    color: var(--ink);
    margin-bottom: 24px;
  }
  .app-hero__l .tag {
    font-family: 'Newsreader', Georgia, serif;
    font-size: clamp(20px, 2.2vw, 26px);
    line-height: 1.4;
    color: var(--ink-soft);
    max-width: 32ch;
  }
  .app-hero__l .num {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 28px;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    color: var(--ink-mute);

    border-bottom: 1px solid var(--line);

  }
  .app-hero__l .num .swatch {
    width: 10px; height: 10px;
    border-radius: 2px;
    background: var(--accent);
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.10);
  }
  .app-hero__l .num .hex {
    color: var(--ink-soft);
    text-transform: uppercase;
  }
  .app-hero__r {
    display: flex; align-items: end; justify-content: flex-end;
    gap: 24px;
  }
  .app-hero__icon {
    width: 132px; height: 132px;
    border-radius: 26%;
    overflow: hidden;
    background: var(--card);
    box-shadow:
      0 1px 0 rgba(255,248,224,0.6),
      0 24px 48px -28px rgba(26,22,16,0.32),
      inset 0 0 0 1px var(--line);
  }
  .app-hero__icon img { width: 100%; height: 100%; object-fit: cover; }

  .app-cta {
    margin-top: 32px;
    display: flex; align-items: center; gap: 14px;
  }
  .app-cta .badge svg { display: block; height: 44px; }
  .app-cta .soon {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-mute);
    padding: 10px 14px;
    border: 1px solid var(--line);
    border-radius: 4px;
  }

  /* ---------- Skjermbilder ---------- */
  .shots-row { margin: 88px 0 96px; }
  .shots-row__head {
    display: flex; justify-content: space-between; align-items: baseline;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 28px;
  }
  .shots {
    display: flex; gap: 18px;
    overflow-x: auto;
    scrollbar-width: none;
    margin: 0 -24px;
    padding: 0 24px 12px;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
  }
  .shots::-webkit-scrollbar { display: none; }
  .shots__item {
    flex: 0 0 auto;
    width: 208px;
    aspect-ratio: 9 / 19.5;
    background: var(--card);
    border-radius: 32px;
    position: relative;
    box-shadow:
      0 1px 0 rgba(255,248,224,0.6),
      0 28px 56px -32px rgba(26,22,16,0.32),
      inset 0 0 0 1px var(--line);
    scroll-snap-align: start;
    overflow: hidden;
  }
  .shots__item::before {
    content: ""; position: absolute;
    top: 12px; left: 50%; transform: translateX(-50%);
    width: 88px; height: 22px;
    background: var(--ink); opacity: 0.85;
    border-radius: 14px;
  }
  @media (min-width: 720px) {
    .shots { margin: 0; padding: 0 0 12px; flex-wrap: nowrap; overflow-x: auto; }
  }

  /* ---------- App content sections ---------- */
  .sect {
    margin-bottom: 72px;
    display: grid;
    grid-template-columns: 1fr;
    gap: 24px;
    max-width: 720px;
  }
  @media (min-width: 720px) {
    .sect { grid-template-columns: 140px 1fr; gap: 48px; }
  }
  .sect h2 {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-mute);
    align-self: start;
  }
  .sect__body p {
    font-family: 'Newsreader', Georgia, serif;
    font-size: 19px;
    line-height: 1.55;
    color: var(--ink);
    max-width: 56ch;
    letter-spacing: -0.005em;
  }
  .sect__body p + p { margin-top: 14px; }
  .sect__body p.lede { font-size: 22px; line-height: 1.45; color: var(--ink); }
  .sect__body p.muted { color: var(--ink-soft); }
  .sect__body h3 {
    font-family: 'Newsreader', Georgia, serif;
    font-size: 22px;
    font-weight: 500;
    color: var(--ink);
    letter-spacing: -0.012em;
    margin-top: 28px;
    margin-bottom: 6px;
  }
  .sect__body h3:first-child { margin-top: 0; }

  /* ---------- Forrige / Neste ---------- */
  .siblings {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    margin-top: 96px;
  }
  .siblings a {
    display: flex; flex-direction: column;
    padding: 28px 24px;
    color: var(--ink);
    position: relative;
    transition: background 320ms var(--ease);
  }
  .siblings a + a { border-left: 1px solid var(--line); }
  .siblings a:hover { background: rgba(26,22,16,0.03); }
  .siblings a.next { text-align: right; align-items: flex-end; }
  .siblings .lab {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--ink-mute);
    margin-bottom: 16px;
    display: flex; align-items: center; gap: 10px;
  }
  .siblings .swatch-mini {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--sib-accent, var(--accent));
  }
  .siblings .nm {
    font-family: 'Newsreader', Georgia, serif;
    font-size: clamp(22px, 3vw, 30px);
    font-weight: 500;
    line-height: 1.05;
    letter-spacing: -0.022em;
    color: var(--ink);
  }
  .siblings .ar {
    font-family: 'Newsreader', Georgia, serif;
    color: var(--ink-mute);
    font-size: 15px;
    margin-top: 8px;
    max-width: 30ch;
  }

  /* ---------- App sub-nav ---------- */
  .app-nav {
    margin: 64px 0 0;
    padding-top: 20px;
    border-top: 1px solid var(--line);
    display: flex; gap: 24px;
    flex-wrap: wrap;
  }
  .app-nav a {
    font-size: 13.5px;
    color: var(--ink-soft);
  }
  .app-nav a:hover { color: var(--accent); }
  .app-nav a[aria-current="page"] {
    color: var(--accent);
    background-image: linear-gradient(var(--accent), var(--accent));
    background-position: 0 100%;
    background-repeat: no-repeat;
    background-size: 100% 1px;
    padding-bottom: 2px;
  }

  /* ---------- Doc-sider ---------- */
  .doc h1 {
    font-family: 'Newsreader', Georgia, serif;
    font-weight: 400;
    font-size: clamp(40px, 6vw, 64px);
    line-height: 1;
    letter-spacing: -0.028em;
    margin-bottom: 24px;
  }
  .doc .doc-meta {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--ink-mute);
    margin-bottom: 36px;
  }
  .doc p.lede {
    font-family: 'Newsreader', Georgia, serif;
    font-size: 22px;
    line-height: 1.45;
    color: var(--ink);
    max-width: 50ch;
    margin-bottom: 56px;
  }
  .doc h2 {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-mute);
    margin: 48px 0 14px;
  }
  .doc h2:first-of-type { margin-top: 0; }
  .doc p {
    font-family: 'Newsreader', Georgia, serif;
    font-size: 19px;
    line-height: 1.55;
    color: var(--ink);
    max-width: 60ch;
    letter-spacing: -0.005em;
  }
  .doc p + p { margin-top: 14px; }

  /* ---------- Reveal-on-scroll ---------- */
  .reveal {
    opacity: 0;
    transform: translateY(12px);
    transition: opacity 720ms var(--ease-out), transform 720ms var(--ease-out);
  }
  .reveal.is-in { opacity: 1; transform: none; }
  .stagger > * {
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 600ms var(--ease-out), transform 600ms var(--ease-out);
    transition-delay: calc(var(--i, 0) * 50ms);
  }
  .stagger.is-in > * { opacity: 1; transform: none; }

  /* ---------- Tastatur-snarveier ---------- */
  .kbd-hint {
    position: fixed;
    bottom: 18px; left: 50%; transform: translate(-50%, 16px);
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 10.5px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--ink-mute);
    background: var(--paper-warm);
    border: 1px solid var(--line);
    padding: 8px 14px;
    border-radius: 999px;
    z-index: 90;
    opacity: 0;
    transition: opacity 360ms var(--ease), transform 360ms var(--ease);
    pointer-events: none;
  }
  .kbd-hint.is-on { opacity: 1; transform: translate(-50%, 0); }
  .kbd-hint kbd {
    font-family: inherit;
    background: var(--ink);
    color: var(--paper-warm);
    padding: 1px 6px;
    border-radius: 3px;
    margin: 0 2px;
    font-size: 9.5px;
  }
  @media (hover: none), (pointer: coarse) { .kbd-hint { display: none; } }

  /* ---------- Side-overgang ---------- */
  .theme-root { animation: pageIn 480ms var(--ease-out) both; }
  @keyframes pageIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: none; }
  }

  /* ============================================================
     MOBIL — 320 / 375 / 390 / 414 / 430
     ============================================================ */
  @media (max-width: 720px) {
    .stage { padding: 22px 18px 24px; }
    .topbar { margin-bottom: 56px; padding-bottom: 16px; }
    .topbar .nav { display: none; }
    .topbar .pill { font-size: 9.5px; padding: 5px 10px; }
    .topbar .mark .meta { display: none; }

    .hero { padding: 8px 0 56px; }
    .hero .display { font-size: clamp(56px, 16vw, 88px); }
    .hero .lede { font-size: 19px; margin-top: 24px; max-width: 28ch; }

    .verket { margin: 16px 0 64px; }
    .verket__head { padding-bottom: 10px; margin-bottom: 0; }
    .verket__head .l, .verket__head .r { font-size: 9.5px; letter-spacing: 0.18em; }
    .verket__row {
      grid-template-columns: 32px 1fr 18px;
      gap: 14px;
      padding: 22px 4px;
    }
    .verket__meta { display: none; }
    .verket__name { font-size: clamp(22px, 6.5vw, 28px); }
    .verket__tag { font-size: 13.5px; }
    .verket__row:active::before { transform: scaleX(1); }
    .verket__row:active, .verket__row:active .verket__num,
    .verket__row:active .verket__name, .verket__row:active .verket__tag,
    .verket__row:active .verket__arrow { color: var(--paper-warm); }

    .blocks { gap: 48px; margin: 64px 0 0; }
    .block p { font-size: 19px; line-height: 1.45; }

    .footer { flex-direction: column; gap: 10px; align-items: flex-start; font-size: 11px; }

    .app-hero { gap: 36px; margin-bottom: 56px; }
    .app-hero__l h1 { font-size: clamp(38px, 11vw, 64px); line-height: 1; }
    .app-hero__l .tag { font-size: 18px; }
    .app-hero__r { justify-content: flex-start; }
    .app-hero__icon { width: 96px; height: 96px; }
    .app-cta { margin-top: 24px; }

    .shots-row { margin: 56px 0 64px; }
    .shots-row__head { padding-bottom: 10px; margin-bottom: 18px; }
    .shots { gap: 12px; margin: 0 -18px; padding: 0 18px 12px; }
    .shots__item { width: 70vw; max-width: 220px; min-width: 168px; }

    .sect { gap: 12px; margin-bottom: 48px; }
    .sect h2 { font-size: 10px; }
    .sect__body p { font-size: 17px; }
    .sect__body p.lede { font-size: 19px; }
    .sect__body h3 { font-size: 19px; }

    .siblings { grid-template-columns: 1fr; }
    .siblings a + a { border-left: 0; border-top: 1px solid var(--line); }
    .siblings a.next { text-align: left; align-items: flex-start; }

    .app-nav { gap: 16px 24px; }
    .doc h1 { font-size: clamp(34px, 9vw, 48px); }
    .doc p { font-size: 17px; }
    .doc p.lede { font-size: 19px; }
  }

  @media (max-width: 380px) {
    .hero .display { font-size: clamp(48px, 19vw, 72px); }
    .verket__name { font-size: 22px; }
    .app-hero__l h1 { font-size: clamp(34px, 11vw, 52px); hyphens: auto; }
  }

  @media (prefers-reduced-motion: reduce) {
    .verket__row::before, .theme-root, .reveal, .stagger > * { transition: none; animation: none; }
    .reveal, .stagger > * { opacity: 1; transform: none; }
  }

  /* ---------- Preview-bar ---------- */
  .preview-bar {
    position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
    z-index: 1000;
    background: rgba(26, 22, 16, 0.92);
    color: #F4ECD7;
    padding: 6px 8px;
    border-radius: 999px;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 10.5px;
    display: flex; gap: 2px; align-items: center;
    box-shadow: 0 10px 32px rgba(0,0,0,0.18);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(244,236,215,0.08);
    max-width: calc(100vw - 16px);
    overflow-x: auto;
    scrollbar-width: none;
  }
  .preview-bar::-webkit-scrollbar { display: none; }
  .preview-bar .label {
    opacity: 0.5; padding: 0 10px 0 6px;
    letter-spacing: 0.18em; text-transform: uppercase; font-size: 9px;
    border-right: 1px solid rgba(244,236,215,0.12); margin-right: 4px;
  }
  .preview-bar a {
    color: #F4ECD7; padding: 4px 9px; border-radius: 999px;
    transition: background 160ms ease;
    letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap;
  }
  .preview-bar a:hover { background: rgba(244,236,215,0.08); }
  .preview-bar a[aria-current="true"] { background: var(--accent); color: var(--paper-warm); }
</style>
</head>
<body>

<div class="sweep" aria-hidden="true"></div>
<div class="spotlight" aria-hidden="true"></div>
<div class="progress" aria-hidden="true"></div>

<nav class="preview-bar" aria-label="Preview">
  <span class="label">Preview</span>
  <a href="#/" data-route="/">Hub</a>
  <a href="#/tenkt" data-route="/tenkt">Tenkt</a>
  <a href="#/bumle-bjorn" data-route="/bumle-bjorn">Bumle</a>
  <a href="#/plantekn" data-route="/plantekn">Plantekn</a>
  <a href="#/kvitteringsvakt" data-route="/kvitteringsvakt">Kvittering</a>
  <a href="#/inklings-journal" data-route="/inklings-journal">Inklings</a>
</nav>

<div id="root"></div>
<div class="kbd-hint" aria-hidden="true">Trykk <kbd>1</kbd>–<kbd>5</kbd> for app · <kbd>⌘K</kbd> søk · <kbd>Esc</kbd> hjem</div>

<script>
const APPS = {
  'bumle-bjorn':     { name: 'Bumle Bjørn',      tagline: 'Pedagogisk app for barn 1 til 8 år.',                  icon: 'public/icons/bumle-bjorn.png',     accent: '#A85436' },
  'plantekn':        { name: 'Plantekn',         tagline: 'Tegn romplaner, møbler og ledningsføring.',            icon: 'public/icons/plantekn.png',         accent: '#2C4A3A' },
  'tenkt':           { name: 'Tenkt',            tagline: 'Daglige logikkpuslespill.',                            icon: 'public/icons/tenkt.png',            accent: '#8B6F47' },
  'kvitteringsvakt': { name: 'Kvitteringsvakt',  tagline: 'Kvittering- og garantitracker for det norske markedet.', icon: 'public/icons/kvitteringsvakt.png',  accent: '#7A3A22' },
  'inklings-journal':{ name: 'Inklings Journal', tagline: 'En journalapp.',                                        icon: 'public/icons/inklings-journal.png', accent: '#1F3528' },
};
const ORDER = ['bumle-bjorn','plantekn','tenkt','kvitteringsvakt','inklings-journal'];

// Per-app SVG-glyph — unik geometrisk mark, tegnet i appens accent-farge
const GLYPHS = {
  'bumle-bjorn':
    `<svg viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="1.4">
       <circle cx="60" cy="60" r="52"/>
       <circle cx="54" cy="54" r="36"/>
       <circle cx="60" cy="60" r="22"/>
       <circle cx="60" cy="60" r="3.5" fill="currentColor"/>
     </svg>`,
  'plantekn':
    `<svg viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="1.2">
       <path d="M60 6 V114 M6 60 H114"/>
       <rect x="24" y="24" width="72" height="72"/>
       <path d="M40 24 V96 M56 24 V96 M72 24 V96 M88 24 V96 M24 40 H96 M24 56 H96 M24 72 H96 M24 88 H96" stroke-width="0.6"/>
       <circle cx="60" cy="60" r="3" fill="currentColor"/>
     </svg>`,
  'tenkt':
    `<svg viewBox="0 0 120 120" fill="currentColor">
       <circle cx="30" cy="30" r="6"/><circle cx="60" cy="30" r="6"/><circle cx="90" cy="30" r="6"/>
       <circle cx="30" cy="60" r="6"/><circle cx="60" cy="60" r="9"/><circle cx="90" cy="60" r="6"/>
       <circle cx="30" cy="90" r="6"/><circle cx="60" cy="90" r="6"/><circle cx="90" cy="90" r="6"/>
     </svg>`,
  'kvitteringsvakt':
    `<svg viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
       <path d="M14 26 H106"/><path d="M14 42 H86"/><path d="M14 58 H106"/>
       <path d="M14 74 H72"/><path d="M14 90 H106"/>
       <path d="M2 110 L8 104 L14 110 L20 104 L26 110 L32 104 L38 110 L44 104 L50 110 L56 104 L62 110 L68 104 L74 110 L80 104 L86 110 L92 104 L98 110 L104 104 L110 110 L116 104" stroke-width="1"/>
     </svg>`,
  'inklings-journal':
    `<svg viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
       <path d="M12 92 C 28 36, 58 110, 78 52 S 110 22, 102 14"/>
       <path d="M28 100 C 44 80, 64 96, 88 80" stroke-width="1.2"/>
     </svg>`,
};

// Naviger med farget svep i appens accent
function navWithSweep(routePath, accent) {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) { location.hash = '#' + routePath; return; }
  const sweep = document.querySelector('.sweep');
  if (!sweep) { location.hash = '#' + routePath; return; }
  sweep.style.background = accent || 'var(--accent)';
  sweep.classList.remove('out');
  void sweep.offsetWidth;
  sweep.classList.add('in');
  setTimeout(() => {
    location.hash = '#' + routePath;
    requestAnimationFrame(() => {
      sweep.classList.remove('in');
      sweep.classList.add('out');
      setTimeout(() => sweep.classList.remove('out'), 420);
    });
  }, 280);
}

function setAccent(slug) {
  const r = document.documentElement;
  if (!slug) { r.style.setProperty('--accent', '#2C4A3A'); return; }
  r.style.setProperty('--accent', APPS[slug].accent);
}

function el(tag, attrs = {}, ...children) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null) continue;
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k === 'style') e.setAttribute('style', v);
    else e.setAttribute(k, v);
  }
  for (const c of children.flat()) {
    if (c == null) continue;
    e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  }
  return e;
}

function topbar(view) {
  const isHub = view === 'hub';
  return el('header', { class: 'topbar' },
    el('a', { class: 'mark', href: '#/' },
      el('span', { class: 'nm' }, 'Haug og Datter')
    ),
    isHub
      ? el('span', { class: 'meter' },
          el('span', { class: 'seg' }, el('span', { class: 'dot' }), '59°44′ N · 10°12′ E'),
          el('span', { class: 'seg' }, el('span', { class: 'clock', 'data-clock': '1' }, '——:——:——'))
        )
      : el('nav', { class: 'nav' },
          el('a', { href: '#/' }, 'Tilbake'),
          el('a', { href: 'mailto:jonas@haugogdatter.no' }, 'Kontakt')
        )
  );
}

function splitLetters(text) {
  return [...text].map((ch, i) => {
    const span = document.createElement('span');
    span.className = 'ltr';
    span.textContent = ch === ' ' ? '\u00a0' : ch;
    span.dataset.li = i;
    return span;
  });
}

function renderHub() {
  setAccent(null);
  return el('div', { class: 'theme-root' },
    el('div', { class: 'stage' },
      topbar('hub'),

      el('section', { class: 'hero reveal' },
        el('h1', { class: 'display', 'data-parallax-title': '1' },
          ...splitLetters('Haug '),
          el('span', { class: 'amp' }, 'og'),
          ...splitLetters(' Datter')
        ),
        el('p', { class: 'lede' }, 'Et lite app-makeri. Apper laget med tid, tålmodighet og litt for mye kaffe.')
      ),

      el('section', { class: 'verket reveal', 'aria-label': 'Apper' },
        el('div', { class: 'verket__head' },
          el('span', { class: 'micro l' }, 'Apper'),
          el('span', { class: 'micro r' }, '5 / 5')
        ),
        el('div', { class: 'verket__list stagger' },
          ...ORDER.map((slug, i) => {
            const a = APPS[slug];
            const row = el('a', {
              class: 'verket__row',
              href: `#/${slug}`,
              style: `--row-accent:${a.accent}`,
            },
              el('span', { class: 'verket__num' }, String(i + 1).padStart(2, '0')),
              el('span', {},
                el('span', { class: 'verket__name', style: 'display:block' }, a.name),
                el('span', { class: 'verket__tag', style: 'display:block' }, a.tagline)
              ),
              el('span', { class: 'verket__meta' },
                el('span', { class: 'swatch' }),
                el('span', { class: 'hex' }, a.accent.toUpperCase())
              ),
              el('span', { class: 'verket__arrow' }, '→')
            );
            row.style.setProperty('--i', String(i));
            return row;
          })
        )
      ),

      el('section', { class: 'blocks reveal' },
        el('div', { class: 'block' },
          el('h2', {}, 'Om'),
          el('p', {}, 'Haug og Datter drives av Jonas Haug fra Drammen. På kveldstid lager han apper han selv ville brukt.')
        ),
        el('div', { class: 'block' },
          el('h2', {}, 'Kontakt'),
          el('p', {},
            el('a', { class: 'tx-link', href: 'mailto:jonas@haugogdatter.no' }, 'jonas@haugogdatter.no')
          )
        )
      ),

      el('footer', { class: 'footer' },
        el('span', { class: 'l' }, 'Haug og Datter · Drammen'),

}

function appHero(slug) {
  const a = APPS[slug];
  const idx = ORDER.indexOf(slug);
  return el('section', { class: 'app-hero reveal' },
    el('div', { class: 'app-hero__glyph', html: GLYPHS[slug] || '' }),
    el('div', { class: 'app-hero__l' },
      el('span', { class: 'num' },
        el('span', { class: 'swatch' }),
        el('span', { class: 'hex' }, a.accent.toUpperCase()),
        el('span', {}, `· ${String(idx + 1).padStart(2, '0')} / 05`)
      ),
      el('h1', {}, a.name),
      el('p', { class: 'tag' }, a.tagline),
      el('div', { class: 'app-cta' },
        el('span', { class: 'soon' }, 'Kommer snart i App Store')
      )
    ),
    el('div', { class: 'app-hero__r' },
      el('div', { class: 'app-hero__icon' },
        el('img', { src: a.icon, alt: `${a.name} ikon`, width: 132, height: 132 })
      )
    )
  );
}

function shots() {
  return el('div', { class: 'shots-row reveal' },
    el('div', { class: 'shots-row__head' },
      el('span', { class: 'micro' }, 'Skjermbilder'),
      el('span', { class: 'micro' }, 'iPhone')
    ),
    el('div', { class: 'shots' },
      ...[1,2,3,4,5].map(() => el('figure', { class: 'shots__item' }))
    )
  );
}

function appNav(slug, current) {
  const items = [
    ['oversikt',   `#/${slug}`,            'Oversikt'],
    ['personvern', `#/${slug}/personvern`, 'Personvern'],
    ['vilkar',     `#/${slug}/vilkar`,     'Vilkår'],
    ['support',    `#/${slug}/support`,    'Support'],
  ];
  return el('nav', { class: 'app-nav', 'aria-label': 'Sider for denne appen' },
    ...items.map(([id, href, label]) => {
      const a = el('a', { href }, label);
      if (id === current) a.setAttribute('aria-current', 'page');
      return a;
    })
  );
}

function siblings(slug) {
  const idx = ORDER.indexOf(slug);
  const prev = ORDER[(idx - 1 + ORDER.length) % ORDER.length];
  const next = ORDER[(idx + 1) % ORDER.length];
  const card = (s, dir) => {
    const sa = APPS[s];
    return el('a', { class: dir, href: `#/${s}`, style: `--sib-accent:${sa.accent}` },
      el('span', { class: 'lab' },
        el('span', { class: 'swatch-mini' }),
        dir === 'prev' ? '← Forrige' : 'Neste →'
      ),
      el('span', { class: 'nm' }, sa.name),
      el('span', { class: 'ar' }, sa.tagline)
    );
  };
  return el('nav', { class: 'siblings reveal', 'aria-label': 'Andre apper' },
    card(prev, 'prev'),
    card(next, 'next')
  );
}

function sect(label, ...body) {
  return el('section', { class: 'sect reveal' },
    el('h2', {}, label),
    el('div', { class: 'sect__body' }, ...body)
  );
}

function renderApp(slug) {
  setAccent(slug);
  const a = APPS[slug];
  return el('div', { class: 'theme-root', 'data-app': slug },
    el('div', { class: 'app-backdrop', 'aria-hidden': 'true' }),
    el('div', { class: 'stage' },
      topbar('app'),
      appHero(slug),

      sect('Om appen',
        el('p', { class: 'lede' }, `[FYLL INN] Et til tre korte avsnitt om hva ${a.name} gjør, i samme rolige tone som hub-en.`),
        el('p', { class: 'muted' }, '[FYLL INN] Andre avsnitt om bruksområde og hvem appen er til for.')
      ),

      shots(),

      sect('Hva den gjør',
        el('h3', {}, '[FYLL INN funksjon 1]'),
        el('p', { class: 'muted' }, '[FYLL INN kort beskrivelse]'),
        el('h3', {}, '[FYLL INN funksjon 2]'),
        el('p', { class: 'muted' }, '[FYLL INN kort beskrivelse]'),
        el('h3', {}, '[FYLL INN funksjon 3]'),
        el('p', { class: 'muted' }, '[FYLL INN kort beskrivelse]')
      ),

      sect('Hvorfor',
        el('p', {}, '[FYLL INN] Ett avsnitt om motivasjonen. Personlig, ikke marketing.')
      ),

      siblings(slug),
      appNav(slug, 'oversikt'),

      el('footer', { class: 'footer' },
        el('span', { class: 'l' }, `${a.name} · Haug og Datter`),
        el('span', { class: 'r mono', 'data-clock': '1' }, '——:——:——')
      )
    )
  );
}

function renderPersonvern(slug) {
  setAccent(slug);
  const a = APPS[slug];
  const isBumle = slug === 'bumle-bjorn';
  return el('div', { class: 'theme-root', 'data-app': slug },
    el('div', { class: 'app-backdrop', 'aria-hidden': 'true' }),
    el('div', { class: 'stage' },
      topbar('app'),
      el('article', { class: 'doc reveal' },
        el('h1', {}, `Personvern for ${a.name}`),
        el('p', { class: 'doc-meta' }, 'Sist oppdatert · [DATO]'),
        el('p', { class: 'lede' }, `${a.name} er laget av Haug & Datter. Vi tar personvern på alvor, fordi vi selv hater apper som ikke gjør det.`),

        el('h2', {}, 'Data'),
        el('p', {}, '[FYLL INN per app. Typisk: ingen data forlater enheten din. SwiftData lagrer lokalt. iCloud-sync (hvis aktivert) går via Apples krypterte tjeneste.]'),

        el('h2', {}, 'Tredjepartstjenester'),
        el('p', {}, '[FYLL INN. Typisk: ingen. Hvis StoreKit eller iCloud nevnt: Apple sin egen.]'),

        isBumle ? el('h2', {}, 'Barn') : null,
        isBumle ? el('p', {}, `[FYLL INN. Spesielt avsnitt om COPPA og GDPR-K, siden ${a.name} er for barn 1 til 8 år.]`) : null,

        el('h2', {}, 'Kontakt'),
        el('p', {}, 'Spørsmål? Send e-post til ', el('a', { class: 'tx-link', href: 'mailto:jonas@haugogdatter.no' }, 'jonas@haugogdatter.no'), '.')
      ),

      appNav(slug, 'personvern'),

      el('footer', { class: 'footer' },
        el('span', { class: 'l' }, `${a.name} · Personvern`),
        el('span', { class: 'r mono', 'data-clock': '1' }, '——:——:——')
      )
    )
  );
}

function route() {
  const hash = location.hash.replace(/^#/, '') || '/';
  const root = document.getElementById('root');
  root.innerHTML = '';
  let view;
  if (hash === '/' || hash === '') view = renderHub();
  else {
    const m = hash.match(/^\/([^/]+)(?:\/(.+))?$/);
    if (m && APPS[m[1]]) {
      const slug = m[1], sub = m[2];
      if (!sub) view = renderApp(slug);
      else if (sub === 'personvern') view = renderPersonvern(slug);
      else view = renderApp(slug);
    } else view = renderHub();
  }
  root.appendChild(view);
  document.querySelectorAll('.preview-bar a').forEach(a => {
    a.removeAttribute('aria-current');
    if (a.dataset.route === '/' + hash.replace(/^\//, '').replace(/\/$/, '')) {
      a.setAttribute('aria-current', 'true');
    }
  });
  window.scrollTo(0, 0);
  initReveals();
  initParallaxTitle();
  startClocks();
  showKbdHint();
  toggleSpotlight(hash === '/' || hash === '');
}

let clockTimer = null;
function startClocks() {
  if (clockTimer) clearInterval(clockTimer);
  const tick = () => {
    const now = new Date();
    const hh = String(now.getHours()).padStart(2, '0');
    const mm = String(now.getMinutes()).padStart(2, '0');
    const ss = String(now.getSeconds()).padStart(2, '0');
    const txt = `${hh}:${mm}:${ss}`;
    document.querySelectorAll('[data-clock]').forEach(n => { n.textContent = txt; });
  };
  tick();
  clockTimer = setInterval(tick, 1000);
}

function initParallaxTitle() {
  if (matchMedia('(hover: none), (pointer: coarse)').matches) return;
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const title = document.querySelector('[data-parallax-title]');
  if (!title) return;
  const letters = title.querySelectorAll('.ltr, .amp');
  if (!letters.length) return;
  let raf = 0;
  let tx = 0, ty = 0;
  const onMove = (e) => {
    const r = title.getBoundingClientRect();
    const cx = r.left + r.width / 2;
    const cy = r.top + r.height / 2;
    tx = (e.clientX - cx) / r.width;
    ty = (e.clientY - cy) / r.height;
    if (!raf) raf = requestAnimationFrame(apply);
  };
  const apply = () => {
    raf = 0;
    letters.forEach((l, i) => {
      const phase = (i / letters.length) - 0.5;
      const dx = tx * (4 + phase * 6);
      const dy = ty * (3 + phase * 4);
      const rz = tx * (phase * 2);
      l.style.transform = `translate3d(${dx}px, ${dy}px, 0) rotate(${rz}deg)`;
    });
  };
  document.addEventListener('mousemove', onMove, { passive: true });
  document.addEventListener('mouseleave', () => {
    letters.forEach(l => { l.style.transform = ''; });
  });
}

let revealObs = null;
function initReveals() {
  if (revealObs) revealObs.disconnect();
  if (!('IntersectionObserver' in window) || matchMedia('(prefers-reduced-motion: reduce)').matches) {
    document.querySelectorAll('.reveal, .stagger').forEach(n => n.classList.add('is-in'));
    return;
  }
  revealObs = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting) { e.target.classList.add('is-in'); revealObs.unobserve(e.target); }
    });
  }, { rootMargin: '0px 0px -8% 0px', threshold: 0.05 });
  document.querySelectorAll('.reveal, .stagger').forEach(n => revealObs.observe(n));
}

function initProgress() {
  const bar = document.querySelector('.progress');
  if (!bar) return;
  const update = () => {
    const h = document.documentElement;
    const max = (h.scrollHeight - h.clientHeight) || 1;
    bar.style.width = Math.min(100, Math.max(0, (window.scrollY / max) * 100)) + '%';
  };
  document.addEventListener('scroll', update, { passive: true });
  window.addEventListener('resize', update);
  update();
}

function toggleSpotlight(on) {
  const sp = document.querySelector('.spotlight');
  if (!sp) return;
  sp.classList.toggle('is-on', on);
}
function initSpotlight() {
  const sp = document.querySelector('.spotlight');
  if (!sp) return;
  if (matchMedia('(hover: none), (pointer: coarse)').matches) return;
  document.addEventListener('mousemove', (e) => {
    sp.style.setProperty('--mx', e.clientX + 'px');
    sp.style.setProperty('--my', e.clientY + 'px');
  }, { passive: true });
}

function initKeys() {
  document.addEventListener('keydown', (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.target && /input|textarea|select/i.test(e.target.tagName)) return;
    if (e.key >= '1' && e.key <= '5') {
      location.hash = `#/${ORDER[parseInt(e.key, 10) - 1]}`;
    } else if (e.key === 'Escape') {
      location.hash = '#/';
    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
      const m = location.hash.match(/^#\/([^/]+)/);
      if (m && APPS[m[1]]) {
        const i = ORDER.indexOf(m[1]);
        const n = e.key === 'ArrowLeft' ? (i - 1 + ORDER.length) % ORDER.length : (i + 1) % ORDER.length;
        location.hash = `#/${ORDER[n]}`;
      }
    }
  });
}
function showKbdHint() {
  const hint = document.querySelector('.kbd-hint');
  if (!hint) return;
  hint.classList.add('is-on');
  clearTimeout(showKbdHint._t);
  showKbdHint._t = setTimeout(() => hint.classList.remove('is-on'), 2200);
}

window.addEventListener('hashchange', route);
window.addEventListener('DOMContentLoaded', () => {
  initProgress();
  initSpotlight();
  initKeys();
  initPalette();
  initSweepLinks();
  route();
});

// ---------- Kommandopalett ----------
function initPalette() {
  const root = document.createElement('div');
  root.className = 'palette';
  root.setAttribute('role', 'dialog');
  root.setAttribute('aria-label', 'Kommandopalett');
  root.innerHTML = `
    <div class="palette__bd"></div>
    <div class="palette__panel">
      <div class="palette__head">
        <span class="palette__sigil">⌘K</span>
        <input class="palette__input" type="text" placeholder="Hopp til … (apper, personvern, vilkår, support)" autocomplete="off" spellcheck="false" />
      </div>
      <ul class="palette__list" role="listbox"></ul>
      <div class="palette__foot">
        <span><kbd>↑↓</kbd>Naviger</span>
        <span><kbd>⏎</kbd>Åpne</span>
        <span><kbd>esc</kbd>Lukk</span>
      </div>
    </div>
  `;
  document.body.appendChild(root);
  const input = root.querySelector('.palette__input');
  const list  = root.querySelector('.palette__list');
  const bd    = root.querySelector('.palette__bd');

  const items = [];
  items.push({ label: 'Forsiden', sub: 'Hub', href: '/', hex: '', sw: null });
  ORDER.forEach((slug, i) => {
    const a = APPS[slug];
    items.push({ label: a.name, sub: a.tagline, href: '/' + slug, hex: a.accent.toUpperCase(), sw: a.accent, slug });
    [['personvern','Personvern'],['vilkar','Vilkår'],['support','Support']].forEach(([id,lab]) => {
      items.push({ label: a.name + ' · ' + lab, sub: lab, href: '/' + slug + '/' + id, hex: a.accent.toUpperCase(), sw: a.accent, slug });
    });
  });

  let active = 0;
  let filtered = items.slice();

  function fmtItem(it, i) {
    const sw = it.sw
      ? `<span class="palette__sw" style="background:${it.sw}"></span>`
      : `<span class="palette__sw" style="background:transparent;box-shadow:inset 0 0 0 1px var(--line);"></span>`;
    return `
      <li class="palette__item${i === active ? ' is-active' : ''}" role="option" data-i="${i}">
        ${sw}
        <span class="palette__nm">${it.label}</span>
        <span class="palette__sub">${it.sub || ''}</span>
        <span class="palette__hex">${it.hex || ''}</span>
      </li>`;
  }
  function render() {
    list.innerHTML = filtered.map(fmtItem).join('');
    const cur = list.querySelector('.is-active');
    if (cur) cur.scrollIntoView({ block: 'nearest' });
  }
  function open() {
    root.classList.add('is-open');
    input.value = '';
    filtered = items.slice();
    active = 0;
    render();
    setTimeout(() => input.focus(), 30);
  }
  function close() { root.classList.remove('is-open'); }
  function go(i) {
    const it = filtered[i];
    if (!it) return;
    close();
    const accent = it.slug && APPS[it.slug] ? APPS[it.slug].accent : null;
    if (accent) navWithSweep(it.href, accent);
    else location.hash = '#' + it.href;
  }

  input.addEventListener('input', () => {
    const q = input.value.trim().toLowerCase();
    filtered = q
      ? items.filter(it => (it.label + ' ' + (it.sub || '')).toLowerCase().includes(q))
      : items.slice();
    active = 0;
    render();
  });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') { e.preventDefault(); active = Math.min(active + 1, filtered.length - 1); render(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); active = Math.max(active - 1, 0); render(); }
    else if (e.key === 'Enter') { e.preventDefault(); go(active); }
    else if (e.key === 'Escape') { e.preventDefault(); close(); }
  });
  list.addEventListener('click', (e) => {
    const li = e.target.closest('.palette__item');
    if (!li) return;
    go(parseInt(li.dataset.i, 10));
  });
  list.addEventListener('mousemove', (e) => {
    const li = e.target.closest('.palette__item');
    if (!li) return;
    const i = parseInt(li.dataset.i, 10);
    if (i === active) return;
    active = i;
    list.querySelectorAll('.palette__item').forEach((n, j) => n.classList.toggle('is-active', j === active));
  });
  bd.addEventListener('click', close);

  document.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
      e.preventDefault();
      if (root.classList.contains('is-open')) close(); else open();
    }
  });
}

// ---------- Klikk-interceptor for accent-svep ----------
function initSweepLinks() {
  document.addEventListener('click', (e) => {
    if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    if (e.button !== 0) return;
    const link = e.target.closest('a[href^="#/"]');
    if (!link) return;
    const inSweepable = link.closest('.verket__row, .siblings');
    if (!inSweepable) return;
    const m = link.getAttribute('href').match(/^#\/([^/]+)/);
    if (!m || !APPS[m[1]]) return;
    e.preventDefault();
    navWithSweep(link.getAttribute('href').replace(/^#/, ''), APPS[m[1]].accent);
  });
}
